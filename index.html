<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniChess</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 16px; }
  #status { margin: 12px 0; min-height: 1.5em; }
  label, button, select { font-size: 14px; }
</style>
</head>
<body>
<h2>MiniChess</h2>
<div id="board" style="width: 100%"></div>
<div id="status"></div>
<button id="new">New game</button>
<label>Depth <select id="depth">
  <option>1</option><option>2</option><option selected>3</option><option>4</option>
</select></label>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const game = new Chess();       // you are White, engine is Black
let thinking = false, ready = false, gameId = 0;
const $status = $('#status');

const worker = new Worker('worker.js');
worker.onmessage = ({ data }) => {
  if (data.type === 'ready') { ready = true; updateStatus(); }
  else if (data.type === 'move') { if (data.id === gameId) applyEngineMove(data.move); }
  else if (data.type === 'error') { thinking = false; $status.text('Engine error: ' + data.error); }
};

function updateStatus() {
  if (game.in_checkmate()) $status.text(game.turn() === 'w' ? 'Checkmate. You lose.' : 'Checkmate. You win!');
  else if (game.in_draw()) $status.text('Draw.');
  else if (!ready) $status.text('Loading engine (first load takes a few seconds)...');
  else if (thinking) $status.text('Engine thinking...');
  else $status.text('Your move' + (game.in_check() ? ' (check)' : '') + '.');
}

function onDragStart(source, piece) {
  if (game.game_over() || thinking || game.turn() !== 'w' || piece[0] !== 'w') return false;
}

function onDrop(source, target) {
  const move = game.move({ from: source, to: target, promotion: 'q' });
  if (move === null) return 'snapback';
  thinking = true;
  updateStatus();
  if (!game.game_over()) worker.postMessage({ fen: game.fen(), depth: +$('#depth').val(), id: gameId });
  else thinking = false;
}

function applyEngineMove(uci) {
  thinking = false;
  if (!uci) { updateStatus(); return; }
  game.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] });
  board.position(game.fen());
  updateStatus();
}

const board = Chessboard('board', {
  draggable: true,
  position: 'start',
  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
  onDragStart, onDrop,
  onSnapEnd: () => board.position(game.fen()),   // handles castling / en passant / promotion
});

$('#new').on('click', () => { gameId++; game.reset(); board.start(); thinking = false; updateStatus(); });
updateStatus();
</script>
</body>
</html>
